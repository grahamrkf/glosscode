<!DOCTYPE html>
<!-- Smoke test for the program: run as
       glosscode --ui tests/app_smoke.html <a G-code file>
     It opens the file through the app, runs a core method, saves a copy beside it as <file>.smoke.nc with one
     line changed, and closes the window. tests/app_smoke.cmake checks the copy. -->
<html><head><meta charset="utf-8"><title>GlossCode smoke test</title></head>
<body>
<pre id="log">running</pre>
<script>
(async () => {
  const N = window.GlossCodeNative, log = t => { document.getElementById("log").textContent += "\n" + t; };
  try {
    if (!N) throw new Error("GlossCodeNative is missing");
    const f = await N.startup();
    if (!f) throw new Error("no file on the command line");
    const t = await N.core("tokenize", { text:"g1x1." });
    if (t.tok.join(" ") !== "G1 X1.") throw new Error("tokenize gave " + JSON.stringify(t));
    log(f.doc.lines.length + " lines");
    // Change the second block's words; every other block keeps its raw text.
    const lines = f.doc.lines.map((l, i) => i === 1 ? { tok:[...l.tok, "(SMOKE)"] } : l);
    const r = await N.save({ path:f.path + ".smoke.nc", name:f.name, latin1:f.latin1, doc:{ ...f.doc, lines } });
    log("saved " + r.bytes + " bytes");
  } catch (e){ log("FAILED " + (e && e.message || e)); }
  await N.quit();
})();
</script>
</body></html>

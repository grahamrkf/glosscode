# Builds, tests and packages GlossCode on every push and pull request:
# - core: the portable C core and its tests with gcc and clang (sanitizers on), plus a check that the
#   golden files still match what the UI shows, and the UI tests
# - linux: the whole program with GTK 3 and WebKitGTK, including a smoke test in a virtual display,
#   packaged as .deb, .rpm and a portable .tar.gz
# - windows: the whole program with MinGW-w64 as one static GlossCode.exe, packaged as an installer
#   and a portable .zip
# - examples: the sample programs, which aren't built into the program, as their own .zip
# Each packaging job uploads the release files (docs/releasing.md) as an artifact; release.yml calls
# this workflow on a version tag and attaches them to a draft release.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  core:
    name: Core (${{ matrix.cc }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Golden files match the UI
        run: node scripts/make-goldens.mjs --check
      - name: UI checks
        run: node tests/test_ui.mjs
      - name: UI data files are up to date
        run: |
          node scripts/make-ui-data.mjs
          node scripts/make-fonts.mjs
          git diff --exit-code src/ui
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DGLOSSCODE_APP=OFF -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=${{ matrix.cc }}
          "-DCMAKE_C_FLAGS=-fsanitize=address,undefined -fno-sanitize-recover=all -Werror"
          -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  linux:
    name: Linux program
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install GTK and WebKitGTK
        # The package download has hung on GitHub's runners, and their Ubuntu mirror
        # (azure.archive.ubuntu.com) has been unreachable. Time out each try, retry up to three
        # times (from archive.ubuntu.com after the first fails), and skip the slow man-db index rebuild.
        timeout-minutes: 15
        run: |
          echo 'set man-db/auto-update false' | sudo debconf-communicate >/dev/null || true
          sudo rm -f /var/lib/man-db/auto-update
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          for try in 1 2 3; do
            if timeout 240 sudo apt-get $APT update &&
               timeout 360 sudo apt-get $APT install -y --no-install-recommends ninja-build libgtk-3-dev libwebkit2gtk-4.1-dev xvfb desktop-file-utils; then
              exit 0
            fi
            echo "apt try $try failed or timed out; retrying from archive.ubuntu.com"
            printf 'http://archive.ubuntu.com/ubuntu/\n' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null || true
            sudo sed -i 's#http://azure\.archive\.ubuntu\.com/ubuntu#http://archive.ubuntu.com/ubuntu#g' /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list 2>/dev/null || true
            sleep 10
            sudo dpkg --configure -a || true
          done
          exit 1
      - name: Install nFPM (builds the .deb and .rpm)
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.48.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: Test (core and smoke test)
        run: ctest --test-dir build --output-on-failure
      - name: Package
        run: scripts/package-linux.sh build dist
      - name: Check the packages
        run: |
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb
          sudo apt-get install -y ./dist/*.deb
          test -x /usr/bin/glosscode
          desktop-file-validate /usr/share/applications/glosscode.desktop
          tar -tzf dist/*-portable.tar.gz
      - uses: actions/upload-artifact@v6
        with:
          name: release-linux
          path: dist/*
          if-no-files-found: error

  windows:
    name: Windows program
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v6
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            git
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: Check that the .exe needs no DLLs beyond Windows'
        run: |
          objdump -p build/GlossCode.exe | grep "DLL Name" | tee dlls.txt
          if grep -iE "libgcc|libstdc|libwinpthread|WebView2Loader" dlls.txt; then
            echo "GlossCode.exe depends on a DLL that isn't part of Windows"; exit 1
          fi
      - name: Test (core and smoke test)
        run: ctest --test-dir build --output-on-failure --timeout 180
      - name: Install Inno Setup if the runner lacks it
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Package
        shell: pwsh
        run: ./scripts/package-windows.ps1 -Build build -Out dist
      - name: Check the installer
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\*-setup.exe | Select-Object -First 1
          $p = Start-Process $setup.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exited with $($p.ExitCode)" }
          $exe = "$env:LOCALAPPDATA\Programs\GlossCode\GlossCode.exe"
          if (-not (Test-Path $exe)) { throw "$exe wasn't installed" }
          if (Test-Path "$env:LOCALAPPDATA\Programs\GlossCode\portable") { throw "the installed copy looks portable" }
          $u = Start-Process "$env:LOCALAPPDATA\Programs\GlossCode\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "uninstaller exited with $($u.ExitCode)" }
          # The uninstaller hands over to a copy of itself in %TEMP%, so wait for the file to go.
          for ($i = 0; $i -lt 30 -and (Test-Path $exe); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path $exe) { throw "the uninstaller left GlossCode.exe behind" }
          Expand-Archive dist\*-portable.zip -DestinationPath portable-check
          Get-ChildItem -Recurse portable-check | Format-Table FullName, Length
      - uses: actions/upload-artifact@v6
        with:
          name: release-windows
          path: dist/*
          if-no-files-found: error

  examples:
    name: Example programs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Package
        run: scripts/package-examples.sh dist
      - uses: actions/upload-artifact@v6
        with:
          name: release-examples
          path: dist/*
          if-no-files-found: error

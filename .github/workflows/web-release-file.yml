# Adds the self-host web app (GlossCode-<version>-web.zip) to a release that was published before the
# release workflow made it, and adds its line to that release's SHA256SUMS.txt. Run it by hand on main
# (Actions › Add web app to release › Run workflow); it uses the release for VERSION (v<VERSION>), which
# must already exist. The release's other files aren't changed. Later releases get the zip from release.yml.
name: Add web app to release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  attach:
    name: Build and attach the web app
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install clang with the WASI C library
        timeout-minutes: 10
        run: |
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          for try in 1 2 3; do
            if timeout 180 sudo apt-get $APT update &&
               timeout 240 sudo apt-get $APT install -y --no-install-recommends clang lld wasi-libc libclang-rt-18-dev-wasm32; then
              exit 0
            fi
            echo "apt try $try failed; retrying"; sleep 10
          done
          exit 1
      - name: Build and package the web app
        run: |
          scripts/build-wasm.sh build-web
          scripts/package-web.sh build-web/core.wasm dist
      - name: Upload the zip and update SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ "$GITHUB_REF_NAME" = main ] || { echo "Run it on main, not $GITHUB_REF_NAME"; exit 1; }
          v=$(tr -d ' \r\n' < VERSION)
          zip="GlossCode-$v-web.zip"
          test -f "dist/$zip" || { echo "dist/$zip wasn't built"; ls dist; exit 1; }
          gh release view "v$v" > /dev/null || { echo "There's no release v$v"; exit 1; }
          mkdir sums
          gh release download "v$v" --pattern SHA256SUMS.txt --dir sums
          grep -v -- "-web\.zip$" sums/SHA256SUMS.txt > sums/new.txt || true
          (cd dist && sha256sum -- "$zip") >> sums/new.txt
          mv sums/new.txt sums/SHA256SUMS.txt
          cat sums/SHA256SUMS.txt
          gh release upload "v$v" "dist/$zip" sums/SHA256SUMS.txt --clobber
